<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RodApp — Documentos</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    /* ── Tarjeta de documento ──────── */
    .doc-card-full { margin:0 16px 16px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden; }
    .doc-card-header { padding:20px;display:flex;align-items:center;gap:14px; }
    .doc-card-icon { width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .doc-card-meta strong { font-family:var(--font-display);font-size:1.1rem;display:block; }
    .doc-card-meta span   { font-size:0.78rem;color:var(--text-muted); }

    /* Campos de detalle */
    .detail-body { padding:0 20px 20px; }
    .detail-row  { display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border); }
    .detail-row:last-child { border-bottom:none; }
    .detail-lbl  { font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;flex:1; }
    .detail-val  { font-size:0.88rem;font-weight:500;text-align:right;max-width:62%; }

    /* Alerta de vencimiento */
    .expiry-alert { margin:0 16px 16px;border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start; }
    .expiry-alert svg { flex-shrink:0;margin-top:1px; }

    /* Nota legal */
    .legal-note { margin:0 16px 16px;background:rgba(0,212,200,0.03);border:1px solid rgba(0,212,200,0.12);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start; }
    .legal-note p { font-size:0.8rem;line-height:1.5; }

    /* ── Formulario ────────────────── */
    .form-step-tag { font-family:var(--font-mono);font-size:0.68rem;color:var(--accent-cyan);letter-spacing:0.1em;padding:0 20px;margin-bottom:16px;display:block; }

    /* Footer fijo */
    .fixed-footer { position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:14px 20px;background:var(--bg-dark);border-top:1px solid var(--border);z-index:50; }
    
    .btn-delete { background:rgba(239,68,68,0.1) !important; color:var(--accent-red) !important; border:1px solid rgba(239,68,68,0.3) !important; }
    .btn-delete:hover { background:rgba(239,68,68,0.2) !important; }
  </style>
</head>
<body>
<div id="main-view" style="padding-bottom:90px;">

  <!-- Encabezado dinámico -->
  <div class="page-header fade-up stagger-1">
    <a href="garage.html" class="back-btn" id="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h2 id="page-title">Documentos</h2>
    <div style="width:32px;"></div>
  </div>

  <!-- ════ SELECTOR DE MOTOS ════════════════════════════ -->
  <div id="select-moto-mode">
    <div style="padding:20px 16px;">
      <p style="color:var(--text-muted);margin-bottom:16px;">Selecciona una motocicleta para gestionar sus documentos</p>
      <div id="motos-list" class="doc-cards fade-up stagger-2"></div>
    </div>
  </div>

  <!-- ════ VISTA DETALLE ════════════════════════════════ -->
  <div id="view-mode" style="display:none;">
    <div id="detail-container"></div>
  </div>

  <!-- ════ FORMULARIO ════════════════════════════════ -->
  <div id="edit-mode">
    <span class="form-step-tag">DATOS DEL DOCUMENTO</span>
    
    <div class="form-group" style="margin:0 16px 20px;">
      <label>Tipo de documento *</label>
      <select id="doc-tipo">
        <option value="">Selecciona un documento</option>
        <option value="SOAT">SOAT</option>
        <option value="TECNOMECANICA">Revisión Técnico-Mecánica (RTM)</option>
        <option value="LICENCIA_TRANSITO">Licencia de Tránsito</option>
        <option value="SEGURO_TODO_RIESGO">Seguro Todo Riesgo</option>
        <option value="REVISION_TECNICA">Revisión Técnica</option>
      </select>
    </div>

    <div class="form-group" style="margin:0 16px 20px;">
      <label>Número de póliza / certificado (opcional)</label>
      <input type="text" id="doc-poliza" placeholder="Ej. 1234567890" style="font-family:var(--font-mono);"/>
    </div>

    <div class="form-group" style="margin:0 16px 20px;">
      <label>Fecha de vencimiento *</label>
      <input type="date" id="doc-fecha"/>
    </div>

    <div class="legal-note fade-up" style="margin:0 16px 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>Los documentos vencidos aparecerán en rojo. Los que vencen en menos de 30 días aparecerán en naranja.</p>
    </div>
  </div>

</div>

<!-- Footer fijo -->
<div class="fixed-footer" id="footer-view" style="display:none;">
  <a href="#" id="back-btn-view" class="btn btn-outline" style="flex:1;">Volver al Garaje</a>
  <button onclick="enterEdit()" class="btn btn-primary" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Editar
  </button>
</div>

<div class="fixed-footer" id="footer-edit" style="display:flex; gap:12px;">
  <button onclick="cancelEdit()" class="btn btn-outline" style="flex:1;">Cancelar</button>
  <button id="btn-delete" onclick="deleteDoc()" class="btn btn-delete" style="flex:1; display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    Eliminar
  </button>
  <button onclick="saveDoc()" class="btn btn-primary" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
    Guardar
  </button>
</div>

<script src="../js/main.js"></script>
<script>
  // =========================
  // Config
  // =========================
  const API_BASE = "http://localhost:8080";

  const DOCS_ICON_MAP = {
    SOAT: {
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="1.8" width="26" height="26"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>',
      bg: "rgba(34,197,94,0.15)",
      name: "SOAT Digital",
    },
    TECNOMECANICA: {
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-orange)" stroke-width="1.8" width="26" height="26"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
      bg: "rgba(255,107,53,0.15)",
      name: "Certificado RTM",
    },
    LICENCIA_TRANSITO: {
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.8" width="26" height="26"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
      bg: "rgba(0,212,200,0.15)",
      name: "Licencia de Tránsito",
    },
    SEGURO_TODO_RIESGO: {
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.8" width="26" height="26"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
      bg: "rgba(0,212,200,0.15)",
      name: "Seguro Todo Riesgo",
    },
    REVISION_TECNICA: {
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="1.8" width="26" height="26"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      bg: "rgba(34,197,94,0.15)",
      name: "Revisión Técnica",
    },
  };

  const params = new URLSearchParams(window.location.search);
  const motoId = params.get("motoId");
  const docId = params.get("docId");
  const action = params.get("action");

  let currentDoc = null;

  // =========================
  // Helpers
  // =========================
  function docsBaseUrl() {
    return `${API_BASE}/api/motos/${motoId}/documentos`;
  }

  function getStatusBadge(fechaVencimiento) {
    if (!fechaVencimiento) return '<span class="badge badge-cyan">Sin fecha</span>';

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const expiry = new Date(fechaVencimiento);
    const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

    if (diffDays < 0) return '<span class="badge badge-red">Vencido</span>';
    if (diffDays < 30) return '<span class="badge badge-orange">Expira pronto</span>';
    return '<span class="badge badge-green">Vigente</span>';
  }

  function formatDate(dateStr) {
    if (!dateStr) return "Sin fecha";
    const date = new Date(dateStr);
    return new Intl.DateTimeFormat("es-CO", {
      day: "2-digit",
      month: "short",
      year: "numeric",
    }).format(date);
  }

  function showSection({ selector = false, view = false, edit = false, footerView = false, footerEdit = false }) {
    document.getElementById("select-moto-mode").style.display = selector ? "block" : "none";
    document.getElementById("view-mode").style.display = view ? "block" : "none";
    document.getElementById("edit-mode").style.display = edit ? "block" : "none";
    document.getElementById("footer-view").style.display = footerView ? "flex" : "none";
    document.getElementById("footer-edit").style.display = footerEdit ? "flex" : "none";
  }

  function setViewFooterEditVisible(visible) {
    const editBtn = document.querySelector("#footer-view .btn-primary");
    if (editBtn) editBtn.style.display = visible ? "flex" : "none";
  }

  // =========================
  // Init
  // =========================
  document.addEventListener("DOMContentLoaded", async () => {
    if (!motoId) {
      await renderMotoSelector();
      return;
    }

    document.getElementById("back-link").href = `moto-detail.html?id=${motoId}`;
    document.getElementById("back-btn-view").href = `moto-detail.html?id=${motoId}`;

    if (docId) {
      await loadDocument(docId);
      return;
    }

    if (action === "nuevo") {
      enterEdit();
      return;
    }

    await loadDocsList();
  });

  // =========================
  // Selector de moto (cuando no llega motoId)
  // =========================
  async function renderMotoSelector() {
    const usuario = getUser();
    if (!usuario || !usuario.id) {
      alert("Debes iniciar sesión");
      window.location.href = "../index.html";
      return;
    }

    showSection({ selector: true });
    document.getElementById("page-title").textContent = "Selecciona motocicleta";

    try {
      const res = await fetch(`${API_BASE}/api/motos/usuario/${usuario.id}`);
      const motos = await res.json();
      const list = document.getElementById("motos-list");

      if (!Array.isArray(motos) || motos.length === 0) {
        list.innerHTML = `<div class="card" style="padding:16px;">No tienes motos registradas.</div>`;
        return;
      }

      list.innerHTML = motos
        .map(
          (m) => `
          <div class="doc-card" onclick="window.location='documents.html?motoId=${m.id}'">
            <div class="doc-card-info">
              <strong>${m.marca} ${m.modelo}</strong>
              <span>Placa: ${m.placa || "Sin placa"}</span>
            </div>
          </div>
        `
        )
        .join("");
    } catch (e) {
      console.error(e);
      alert("Error cargando motos");
    }
  }

  // =========================
  // Listado de documentos de la moto
  // =========================
  async function loadDocsList() {
    try {
      const res = await fetch(docsBaseUrl());
      const raw = await res.text();
      if (!res.ok) {
        console.error("Backend error:", raw);
        alert("Error cargando documentos");
        return;
      }

      const docs = raw ? JSON.parse(raw) : [];
      document.getElementById("page-title").textContent = "Documentos";
      showSection({ view: true, footerView: true });
      setViewFooterEditVisible(false); // en lista no hay "Editar"

      if (!Array.isArray(docs) || docs.length === 0) {
        document.getElementById("detail-container").innerHTML = `
          <div class="card" style="margin:0 16px 16px; padding:16px;">
            No hay documentos registrados para esta moto.
          </div>
          <div class="doc-card" style="margin:0 16px;" onclick="window.location='documents.html?motoId=${motoId}&action=nuevo'">
            <div class="doc-card-info">
              <strong>+ Añadir documento</strong>
              <span>Registrar SOAT, RTM, licencia, etc.</span>
            </div>
          </div>
        `;
        return;
      }

      document.getElementById("detail-container").innerHTML = `
        <div class="doc-card" style="margin:0 16px 12px;" onclick="window.location='documents.html?motoId=${motoId}&action=nuevo'">
          <div class="doc-card-info">
            <strong>+ Añadir documento</strong>
            <span>Registrar nuevo documento</span>
          </div>
        </div>
        ${docs
          .map((doc) => {
            const iconData = DOCS_ICON_MAP[doc.tipo] || DOCS_ICON_MAP.SOAT;
            const status = getStatusBadge(doc.fechaVencimiento);
            return `
              <div class="doc-card-full" style="margin:0 16px 12px; cursor:pointer;" onclick="window.location='documents.html?motoId=${motoId}&docId=${doc.id}'">
                <div class="doc-card-header">
                  <div class="doc-card-icon" style="background:${iconData.bg};">${iconData.icon}</div>
                  <div class="doc-card-meta" style="flex:1;">
                    <strong>${iconData.name}</strong>
                    <span>${doc.numeroPoliza || "S/N"} · ${formatDate(doc.fechaVencimiento)}</span>
                  </div>
                  ${status}
                </div>
              </div>
            `;
          })
          .join("")}
      `;
    } catch (e) {
      console.error(e);
      alert("Error de conexión al cargar documentos");
    }
  }

  // =========================
  // Cargar detalle de un documento
  // =========================
  async function loadDocument(id) {
    try {
      const res = await fetch(`${docsBaseUrl()}/${id}`);
      const raw = await res.text();
      if (!res.ok) {
        console.error("Backend error:", raw);
        alert("Error cargando documento");
        return;
      }

      const doc = raw ? JSON.parse(raw) : null;
      currentDoc = doc;
      renderViewMode(doc);
    } catch (e) {
      console.error(e);
      alert("Error de conexión al cargar documento");
    }
  }

  function renderViewMode(doc) {
    const iconData = DOCS_ICON_MAP[doc.tipo] || DOCS_ICON_MAP.SOAT;
    const status = getStatusBadge(doc.fechaVencimiento);

    document.getElementById("page-title").textContent = iconData.name;
    document.getElementById("detail-container").innerHTML = `
      <div class="doc-card-full fade-up stagger-2" style="background:var(--bg-card);">
        <div class="doc-card-header" style="background:linear-gradient(135deg,#0d1f18,#091810);">
          <div class="doc-card-icon" style="background:${iconData.bg};">${iconData.icon}</div>
          <div class="doc-card-meta">
            <strong>${iconData.name}</strong>
            <span>${status}</span>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-row"><span class="detail-lbl">N° Póliza</span><span class="detail-val" style="font-family:var(--font-mono);">${doc.numeroPoliza || "S/N"}</span></div>
          <div class="detail-row"><span class="detail-lbl">Vencimiento</span><span class="detail-val">${formatDate(doc.fechaVencimiento)}</span></div>
          <div class="detail-row"><span class="detail-lbl">Estado</span><span class="detail-val">${status}</span></div>
        </div>
      </div>
    `;

    showSection({ view: true, footerView: true });
    setViewFooterEditVisible(true);
  }

  // =========================
  // Edit/Create
  // =========================
  function enterEdit() {
    if (currentDoc) {
      document.getElementById("doc-tipo").value = currentDoc.tipo || "";
      document.getElementById("doc-poliza").value = currentDoc.numeroPoliza || "";
      document.getElementById("doc-fecha").value = currentDoc.fechaVencimiento || "";
      document.getElementById("btn-delete").style.display = "block";
      document.getElementById("page-title").textContent = "Editar Documento";
    } else {
      document.getElementById("doc-tipo").value = "";
      document.getElementById("doc-poliza").value = "";
      document.getElementById("doc-fecha").value = "";
      document.getElementById("btn-delete").style.display = "none";
      document.getElementById("page-title").textContent = "Nuevo Documento";
    }

    showSection({ edit: true, footerEdit: true });
  }

  async function cancelEdit() {
    if (currentDoc) {
      renderViewMode(currentDoc);
    } else {
      await loadDocsList();
    }
  }

  async function saveDoc() {
    const tipo = document.getElementById("doc-tipo").value;
    const numeroPoliza = document.getElementById("doc-poliza").value.trim();
    const fechaVencimiento = document.getElementById("doc-fecha").value;

    if (!tipo || !fechaVencimiento) {
      alert("Por favor completa los campos requeridos");
      return;
    }

    const payload = {
      tipo,
      numeroPoliza: numeroPoliza || null,
      fechaVencimiento,
    };

    const url = currentDoc
      ? `${docsBaseUrl()}/${currentDoc.id}`
      : `${docsBaseUrl()}`;

    const method = currentDoc ? "PUT" : "POST";

    try {
      const r = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const raw = await r.text();
      if (!r.ok) {
        console.error("Backend error:", raw);
        alert("Error backend: " + raw);
        return;
      }

      const doc = raw ? JSON.parse(raw) : null;
      if (doc) {
        currentDoc = doc;
        renderViewMode(doc);
      } else {
        await loadDocsList();
      }

      alert("✅ Documento guardado correctamente");
    } catch (err) {
      console.error(err);
      alert("Error de conexión al guardar documento");
    }
  }

  async function deleteDoc() {
    if (!currentDoc) return;

    if (!confirm("¿Estás seguro de que deseas eliminar este documento?")) return;

    try {
      const r = await fetch(`${docsBaseUrl()}/${currentDoc.id}`, { method: "DELETE" });
      const raw = await r.text();

      if (!r.ok) {
        console.error("Backend error:", raw);
        alert("Error al eliminar documento");
        return;
      }

      alert("✅ Documento eliminado");
      currentDoc = null;
      await loadDocsList();
    } catch (err) {
      console.error(err);
      alert("Error de conexión al eliminar documento");
    }
  }
</script>
</body>
</html>
