<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RodApp — Historial</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    /* Stats strip */
    .stats-strip {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin: 0 16px 20px;
    }
    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px; text-align: center;
    }
    .stat-box .val {
      font-family: var(--font-display);
      font-size: 1.1rem; font-weight: 700;
      display: block; color: var(--accent-cyan);
    }
    .stat-box .lbl {
      font-size: 0.68rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* Timeline */
    .month-header {
      padding: 8px 20px;
      font-family: var(--font-display);
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg-dark);
      position: sticky; top: 0; z-index: 2;
    }
    .history-item {
      display: flex; align-items: center;
      padding: 14px 20px; gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.15s;
    }
    .history-item:hover { background: var(--bg-surface); }

    .h-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .h-info { flex: 1; }
    .h-info strong { display: block; font-size: 0.88rem; font-weight: 500; }
    .h-info span { font-size: 0.75rem; color: var(--text-muted); }
    .h-amount { text-align: right; }
    .h-amount strong { display: block; font-family: var(--font-mono); font-size: 0.88rem; color: var(--accent-orange); }
    .h-amount span { font-size: 0.7rem; color: var(--text-muted); }

    /* Type badge */
    .type-tag {
      font-size: 0.65rem; font-weight: 600;
      font-family: var(--font-display);
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header fade-up stagger-1">
      <h2>Historial</h2>
      <button style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
    </div>

    <!-- Stats dinámicos -->
    <div class="stats-strip fade-up stagger-2" id="stats-container">
      <div class="stat-box">
        <span class="val" id="stat-events">0</span>
        <span class="lbl">eventos</span>
      </div>
      <div class="stat-box">
        <span class="val" style="color:var(--accent-orange);" id="stat-spent">$0</span>
        <span class="lbl">total mes</span>
      </div>
      <div class="stat-box">
        <span class="val" style="color:var(--accent-green);" id="stat-motos">0</span>
        <span class="lbl">motos</span>
      </div>
    </div>

    <!-- Timeline dinámica -->
    <div class="fade-up stagger-3" id="history-timeline">
      <!-- Los datos reales se cargarán aquí -->
      <div style="padding:40px 20px; text-align:center; color:var(--text-muted);">
        <p>Cargando historial...</p>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="window.location='garage.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </button>

  <script src="../js/main.js"></script>
  <script>
    async function initHistory() {
      const usuario = getUser();
      const timeline = document.getElementById('history-timeline');
      
      if (!usuario.id) {
        window.location.href = '../index.html';
        return;
      }

      try {
        // 1. Obtener Tanqueadas
        const resTanqueadas = await fetch(`http://localhost:8081/api/tanqueadas/usuario/${usuario.id}`);
        const tanqueadas = await resTanqueadas.json();

        // 2. Obtener Mantenimientos
        const resMaint = await fetch(`http://localhost:8081/api/mantenimientos/usuario/${usuario.id}`);
        const mantenimientos = await resMaint.json();

        // Combinar y ordenar por fecha (descendente)
        const combined = [
          ...(Array.isArray(tanqueadas) ? tanqueadas : []).map(t => ({ ...t, type: 'COMBUSTIBLE', sortDate: new Date(t.fecha) })),
          ...(Array.isArray(mantenimientos) ? mantenimientos : []).map(m => ({ ...m, type: 'MANTENIMIENTO', sortDate: new Date(m.fecha) }))
        ].sort((a, b) => b.sortDate - a.sortDate);

        renderHistory(combined);
        updateStats(combined, usuario.id);

      } catch (e) {
        console.error(e);
        timeline.innerHTML = '<div style="padding:40px 20px; text-align:center; color:var(--accent-red);">Error al conectar con el servidor</div>';
      }
    }

    function renderHistory(items) {
      const timeline = document.getElementById('history-timeline');
      if (items.length === 0) {
        timeline.innerHTML = `
          <div style="padding:60px 20px; text-align:center; color:var(--text-muted);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="margin-bottom:12px; opacity:0.5;"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
            <p>Aún no tienes registros de combustible o mantenimientos.</p>
          </div>
        `;
        return;
      }

      let html = '';
      let lastMonth = '';

      items.forEach(item => {
        const date = new Date(item.sortDate);
        const monthYear = date.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
        
        if (monthYear !== lastMonth) {
          html += `<div class="month-header">${monthYear}</div>`;
          lastMonth = monthYear;
        }

        const isFuel = item.type === 'COMBUSTIBLE';
        const icon = isFuel 
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.8" width="18" height="18"><path d="M3 22V8l6-6h8l4 4v16"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-orange)" stroke-width="1.8" width="18" height="18"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a6 6 0 1 1 7.9 7.9l-6.9 6.9a2.1 2.1 0 1 1-3-3l6.9-6.9a6 6 0 1 1 7.9-7.9l-3.7 3.7z"/></svg>';
        
        const title = isFuel ? (item.tipoCombustible || 'Recarga de Gasolina') : (item.descripcion || 'Mantenimiento');
        const detail = isFuel ? `${item.galones} gal · ${item.odometro} km` : `${item.taller || 'Taller'} · ${item.kilometraje} km`;
        const color = isFuel ? 'var(--accent-cyan)' : 'var(--accent-orange)';
        const amount = isFuel ? item.valorPagado : item.costo;

        html += `
          <div class="history-item">
            <div class="h-icon" style="background:${color}15;">${icon}</div>
            <div class="h-info">
              <strong>${title}</strong>
              <span>${date.toLocaleDateString()} · ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              <span class="type-tag" style="background:${color}15; color:${color};">${item.type}</span>
            </div>
            <div class="h-amount">
              <strong>-$${amount.toLocaleString()}</strong>
              <span>${item.motocicleta?.placa || ''}</span>
            </div>
          </div>
        `;
      });

      timeline.innerHTML = html;
    }

    async function updateStats(items, userId) {
      document.getElementById('stat-events').textContent = items.length;
      
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      
      const monthlySpent = items
        .filter(i => i.sortDate.getMonth() === currentMonth && i.sortDate.getFullYear() === currentYear)
        .reduce((sum, i) => sum + (i.type === 'COMBUSTIBLE' ? i.valorPagado : i.costo), 0);
      
      document.getElementById('stat-spent').textContent = `$${(monthlySpent/1000).toFixed(0)}k`;

      try {
        const res = await fetch(`http://localhost:8081/api/motos/usuario/${userId}`);
        const motos = await res.json();
        document.getElementById('stat-motos').textContent = motos.length;
      } catch(e) {}
    }

    document.addEventListener('DOMContentLoaded', initHistory);
  </script>
</body>
</html>
