<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RodApp — Documentos</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <link rel="stylesheet" href="../css/documents.css">
</head>
<body>
<div id="main-view" style="padding-bottom:90px;">

  <!-- Encabezado dinámico -->
  <div class="page-header fade-up stagger-1">
    <a href="garage.html" class="back-btn" id="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h2 id="page-title">Documentos</h2>
    <div style="width:32px;"></div>
  </div>

  <!-- Banner mostrando la moto seleccionada (cuando aplique) -->
  <div id="selected-moto-banner" style="display:none; padding:12px 16px; margin-bottom:8px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div id="selected-moto-info" style="font-weight:600;"></div>
      <a href="#" id="change-moto-link" style="color:var(--accent-cyan); text-decoration:none; font-size:0.9rem;">Cambiar</a>
    </div>
  </div>

  <!-- CTA visible para añadir documento (cuando hay moto seleccionada) -->
  <div id="add-doc-cta" style="display:none; padding:0 16px 12px;">
    <a id="add-doc-btn" href="#" class="btn btn-primary" style="display:inline-flex; align-items:center; gap:10px; padding:12px 16px; font-weight:700;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
      Añadir documento
    </a>
  </div>

  <!-- ════ SELECTOR DE MOTOS ════════════════════════════ -->
  <div id="select-moto-mode">
    <div style="padding:20px 16px;">
      <p style="color:var(--text-muted);margin-bottom:16px;">Selecciona una motocicleta para gestionar sus documentos</p>
      <div id="motos-list" class="doc-cards fade-up stagger-2"></div>
    </div>
  </div>

  <!-- ════ VISTA DETALLE ════════════════════════════════ -->
  <div id="view-mode" style="display:none;">
    <div id="detail-container"></div>
  </div>

  <!-- ════ FORMULARIO ════════════════════════════════ -->
  <div id="edit-mode">
    <span class="form-step-tag">DATOS DEL DOCUMENTO</span>
    
    <div class="form-group" style="margin:0 16px 20px;">
      <label>Tipo de documento *</label>
      <select id="doc-tipo">
        <option value="">Selecciona un documento</option>
        <option value="SOAT">SOAT</option>
        <option value="TECNOMECANICA">Revisión Técnico-Mecánica (RTM)</option>
        <option value="LICENCIA_TRANSITO">Licencia de Tránsito</option>
        <option value="SEGURO_TODO_RIESGO">Seguro Todo Riesgo</option>
        <option value="REVISION_TECNICA">Revisión Técnica</option>
      </select>
    </div>

    <div class="form-group" style="margin:0 16px 20px;">
      <label>Número de póliza / certificado (opcional)</label>
      <input type="text" id="doc-poliza" placeholder="Ej. 1234567890" style="font-family:var(--font-mono);"/>
    </div>

    <div class="form-group" style="margin:0 16px 20px;">
      <label>Fecha de vencimiento *</label>
      <input type="date" id="doc-fecha"/>
    </div>

    <div class="legal-note fade-up" style="margin:0 16px 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>Los documentos vencidos aparecerán en rojo. Los que vencen en menos de 30 días aparecerán en naranja.</p>
    </div>
  </div>

</div>

<!-- Footer fijo -->
<div class="fixed-footer" id="footer-view" style="display:none;">
  <a href="#" id="back-btn-view" class="btn btn-outline" style="flex:1;">Volver al Garaje</a>
  <button onclick="enterEdit()" class="btn btn-primary" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Editar
  </button>
</div>

<div class="fixed-footer" id="footer-edit" style="display:flex; gap:12px;">
  <button onclick="cancelEdit()" class="btn btn-outline" style="flex:1;">Cancelar</button>
  <button id="btn-delete" onclick="deleteDoc()" class="btn btn-delete" style="flex:1; display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    Eliminar
  </button>
  <button onclick="saveDoc()" class="btn btn-primary" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
    Guardar
  </button>
</div>

<script src="../js/main.js"></script>
<script src="../js/documents.js"></script>
</body>
</html>
