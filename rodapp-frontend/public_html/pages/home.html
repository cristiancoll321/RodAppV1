<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RodApp — Inicio</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    @media (min-width: 1024px) {
      .home-header { padding: 32px 32px 20px; max-width: 860px; margin-left: auto; margin-right: auto; }
      .home-grid { max-width: 860px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
      .home-main .moto-card { margin: 0 0 16px !important; }
      .home-main .docs-row { margin: 0 0 16px !important; }
      .home-main .quick-actions { padding: 0 !important; }
      .home-main .card, .home-main .tip-card { margin-left: 0 !important; margin-right: 0 !important; }
      .home-main .section-title { padding: 0 !important; }
    }
    .home-header {
      padding: 20px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .greeting { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2px; }
    .greeting-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }

    .notif-btn {
      position: relative;
      width: 40px; height: 40px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-primary);
      text-decoration: none;
    }
    .notif-badge {
      position: absolute; top: -2px; right: -2px;
      width: 12px; height: 12px;
      background: var(--accent-red);
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
      display: none;
    }

    /* Moto card principal */
    .moto-card {
      margin: 20px 16px;
      background: linear-gradient(135deg, #111c24 0%, #0d1a1f 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .moto-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(0,212,200,0.12), transparent 70%);
    }
    .moto-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
    .moto-plate {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .moto-stats {
      display: flex; gap: 20px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .moto-stat { flex: 1; }
    .moto-stat-val {
      font-family: var(--font-display);
      font-size: 1.2rem; font-weight: 700;
      color: var(--accent-cyan);
    }
    .moto-stat-label {
      font-size: 0.7rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    /* Quick actions */
    .quick-actions {
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; text-decoration: none;
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .quick-btn:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0,212,200,0.1);
    }
    .quick-btn-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(0,212,200,0.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-cyan); flex-shrink: 0;
    }
    .quick-btn span { font-size: 0.85rem; font-weight: 500; }

    /* Activity */
    .activity-item {
      display: flex; align-items: center;
      padding: 12px 20px; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); flex-shrink: 0;
    }
    .activity-info { flex: 1; }
    .activity-info strong { display: block; font-size: 0.88rem; }
    .activity-info span { font-size: 0.75rem; color: var(--text-muted); }
    .activity-amount {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-orange);
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="home-header fade-up stagger-1">
      <div>
        <p class="greeting" id="greeting">Hola 🤘</p>
        <p class="greeting-name" id="greeting-name">Cargando...</p>
      </div>
      <a href="notifications.html" class="notif-btn" id="notif-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge" id="notif-badge"></span>
      </a>
    </header>

    <!-- Moto Card Principal -->
    <div class="moto-card fade-up stagger-2" id="home-moto-container">
      <!-- Se carga dinámicamente desde main.js:loadHomeMoto() -->
    </div>

    <!-- Acciones rápidas -->
    <p class="section-title fade-up stagger-3">Acciones Rápidas</p>
    <div class="quick-actions fade-up stagger-4">
      <a id="btn-quick-fuel" href="fuel-register.html" class="quick-btn">
        <div class="quick-btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 22V8l6-6h8l4 4v16"/><path d="M3 14h18"/><path d="M15 2v6"/></svg>
        </div>
        <span>Tanqueada</span>
      </a>
      <a href="maintenance.html" class="quick-btn">
        <div class="quick-btn-icon" style="background:rgba(255,107,53,0.1); color:var(--accent-orange);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <span>Mantenimiento</span>
      </a>
      <a href="garage.html" class="quick-btn">
        <div class="quick-btn-icon" style="background:rgba(255,60,60,0.1); color:var(--accent-red);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span>Mis Motos</span>
      </a>
    </div>

    <div id="home-extra-sections" style="display:none;">
      <p class="section-title fade-up stagger-2">Actividad Reciente</p>
      <div class="card fade-up stagger-5" style="padding: 0;" id="recent-activity">
        <!-- Se cargará si hay datos reales -->
      </div>
    </div>

  <script src="../js/main.js"></script>
  <script>
    // Sobrescribir ligeramente loadHomeMoto para manejar el ID en el botón de tanqueada
    async function initHome() {
      const usuario = getUser();
      if (!usuario.id) return;

      try {
        const res = await fetch(`http://localhost:8081/api/motos/usuario/${usuario.id}`);
        const motos = await res.json();
        if (motos.length > 0) {
          const mainMoto = motos[0];
          document.getElementById('btn-quick-fuel').href = `fuel-register.html?id=${mainMoto.id}`;
          document.getElementById('home-extra-sections').style.display = 'block';
          loadRecentActivity(mainMoto.id);
        }
      } catch (e) { console.error(e); }
    }

    async function loadRecentActivity(motoId) {
      const container = document.getElementById('recent-activity');
      try {
        const res = await fetch(`http://localhost:8081/api/tanqueadas/moto/${motoId}`);
        const data = await res.json();
        if (data.length === 0) {
          container.innerHTML = '<p style="padding:20px; color:var(--text-muted); font-size:0.8rem; text-align:center;">Sin actividad reciente.</p>';
          return;
        }
        // Mostrar solo las últimas 3
        const recent = data.slice(-3).reverse();
        container.innerHTML = recent.map(t => `
          <div class="activity-item">
            <div class="activity-icon" style="background:rgba(0,212,200,0.08); color:var(--accent-cyan);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 22V8l6-6h8l4 4v16"/></svg>
            </div>
            <div class="activity-info">
              <strong>Tanqueo ${t.tipoCombustible}</strong>
              <span>${new Date(t.fecha).toLocaleDateString()}</span>
            </div>
            <span class="activity-amount">-$${t.valorPagado.toLocaleString()}</span>
          </div>
        `).join('');
      } catch (e) { container.innerHTML = '<p>Error.</p>'; }
    }

    document.addEventListener('DOMContentLoaded', initHome);
  </script>
</body>
</html>
