<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RodApp — Garaje</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    .garage-moto-card {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, #0f1e27 0%, #0a141a 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative; overflow: hidden;
    }
    .garage-moto-card::after {
      content: '';
      position: absolute;
      bottom: -20px; right: -20px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(0,212,200,0.08), transparent 70%);
    }
    .moto-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .moto-info strong { font-family: var(--font-display); font-size: 1.3rem; display: block; }
    .moto-info span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }

    .doc-cards { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .doc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text-primary);
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .doc-card:hover { border-color: var(--border-glow); }
    .doc-card-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .doc-card-info { flex: 1; }
    .doc-card-info strong { display: block; font-size: 0.9rem; font-weight: 600; }
    .doc-card-info span { font-size: 0.78rem; color: var(--text-muted); }
    .doc-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    .add-doc-card {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; color: var(--text-muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .add-doc-card:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

    .empty-garage {
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 32px; text-align: center; gap: 12px;
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      margin: 0 16px 20px;
      background: var(--bg-surface);
      border-radius: var(--radius);
      padding: 4px;
    }
    .tab-btn {
      flex: 1; padding: 8px;
      background: transparent;
      border: none; border-radius: 8px;
      font-family: var(--font-display); font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--accent-cyan);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* ── Desktop content width ──────────────── */
    @media (min-width: 768px) {
      .page, .page-no-nav { padding-left: 0; }
      .page-header { max-width: 860px; margin-left: auto; margin-right: auto; }
    }
    @media (min-width: 1024px) {
      .page-header { padding: 32px 32px 20px; }
      .section-title { padding-left: 32px; padding-right: 32px; }
      .card { margin-left: 32px; margin-right: 32px; }
    }

    @media (min-width: 1024px) {
      .garage-moto-card { margin: 0 auto 20px !important; max-width: 900px; }
      .tabs { margin: 0 auto 20px !important; max-width: 900px; padding: 0 40px; box-sizing: border-box; }
      .doc-cards { grid-template-columns: 1fr 1fr; padding: 0 40px; max-width: 900px; margin: 0 auto; }
      .doc-cards > .add-doc-card { grid-column: 1 / -1; }
      .page-header { max-width: 900px; margin: 0 auto; }
      div[style*="padding: 20px 16px 0"] { padding: 20px 40px 0 !important; max-width: 900px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header fade-up stagger-1">
      <h2>Mi Garaje</h2>
      <a href="profile.html" style="display:flex; gap:8px; align-items:center; text-decoration:none; color:var(--text-secondary); font-size:0.85rem;">
        <div id="garage-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--accent-cyan);display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:700; color:var(--bg-dark); font-size:0.9rem;">CR</div>
      </a>
    </div>

    <!-- Contenedor de motos -->
    <div id="motos-container" class="fade-up stagger-2"></div>

    <!-- Garaje vacío -->
    <div id="empty-garage" class="empty-garage fade-up stagger-2" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" width="48" height="48"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <p style="color:var(--text-muted); margin-top:8px;">Tu garaje está vacío</p>
      <p style="font-size:0.85rem; color:var(--text-muted);">Añade tu primera motocicleta</p>
    </div>

    <!-- Documentos -->
    <div id="garage-docs-container">
      <h3 style="padding: 20px 16px 16px; margin: 0; font-family: var(--font-display); font-size: 1.1rem;">Documentos</h3>
      <div id="tab-documentos" class="doc-cards fade-up stagger-3"></div>
    </div><!-- /garage-docs-container -->

    <!-- Agregar moto -->
    <div style="padding: 20px 16px 0;">
      <a href="moto-register.html" class="btn btn-outline fade-up stagger-5">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Añadir motocicleta
      </a>
    </div>
  </div>

  <!-- Bottom Nav / Sidebar -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item active" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Inicio
    </a>
    <a href="garage.html" class="nav-item" id="nav-garage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Garaje
    </a>
    <a href="fuel-register.html" class="nav-item" id="nav-fuel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 22V8l6-6h8l4 4v16"/><path d="M3 14h18"/><path d="M15 2v6"/></svg>
      Tanqueadas
    </a>
    <a href="documents.html" class="nav-item" id="nav-docs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Documentos Legales
    </a>
    <a href="maintenance.html" class="nav-item" id="nav-maint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      Mantenimientos
    </a>
    <a href="profile.html" class="nav-item" id="nav-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Perfil
    </a>
    <a href="javascript:void(0)" onclick="handleLogout()" class="nav-item" style="margin-top: auto; border-top: 1px solid var(--border); width: 100%;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </a>
  </nav>

  <script src="../js/main.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    // Documentos obligatorios vs adicionales
    const DOCS_OBLIGATORIOS = ['SOAT', 'TECNOMECANICA', 'LICENCIA_TRANSITO'];
    const DOCS_ICON_MAP = {
      'SOAT': { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="1.8" width="24" height="24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>', bg: 'rgba(34,197,94,0.12)' },
      'TECNOMECANICA': { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-orange)" stroke-width="1.8" width="24" height="24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>', bg: 'rgba(255,107,53,0.12)' },
      'LICENCIA_TRANSITO': { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.8" width="24" height="24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>', bg: 'rgba(0,212,200,0.12)' },
      'SEGURO_TODO_RIESGO': { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.8" width="24" height="24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>', bg: 'rgba(0,212,200,0.12)' },
      'REVISION_TECNICA': { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="1.8" width="24" height="24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', bg: 'rgba(34,197,94,0.12)' }
    };

    function getStatusBadge(fechaVencimiento) {
      if (!fechaVencimiento) return '<span class="badge badge-cyan">Permanente</span>';
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expiry = new Date(fechaVencimiento);
      const diffTime = expiry - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays < 0) return '<span class="badge badge-red">Vencido</span>';
      if (diffDays < 30) return '<span class="badge badge-orange">Expira pronto</span>';
      return '<span class="badge badge-green">Vigente</span>';
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'Permanente';
      const date = new Date(dateStr);
      return new Intl.DateTimeFormat('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
    }

    function getDocTypeName(tipo) {
      const names = {
        'SOAT': 'SOAT Digital',
        'TECNOMECANICA': 'Certificado RTM',
        'LICENCIA_TRANSITO': 'Licencia de Conducción',
        'SEGURO_TODO_RIESGO': 'Seguro Todo Riesgo',
        'REVISION_TECNICA': 'Revisión Técnica'
      };
      return names[tipo] || tipo;
    }

    async function loadGarageDocs() {
    const usuario = getUser();
    if (!usuario || !usuario.id) return;

      // Obtener ID de la moto actual (si la hay)
    const params = new URLSearchParams(window.location.search);
    let motoId = params.get('motoId');

      // fallback: primera moto del usuario
    if (!motoId) {
      const motosRes = await fetch(`http://localhost:8080/api/motos/usuario/${usuario.id}`);
      const motos = await motosRes.json();
      if (Array.isArray(motos) && motos.length > 0) {
        motoId = motos[0].id;
      }
    }
    
    if (!motoId) {
      document.getElementById('garage-docs-container').style.display = 'none';
      return;
    }

      // Cargar documentos de esta moto
      fetch(`http://localhost:8080/api/documentos/moto/${motoId}`)
        .then(r => r.json())
        .then(data => {
          if (!Array.isArray(data)) data = [];

          // Botón de agregar documento
          const addDocButton = `
            <div class="add-doc-card" onclick="window.location='documents.html?motoId=${motoId}&action=nuevo'">
              <div style="width:44px;height:44px;border-radius:10px;border:1px dashed;display:flex;align-items:center;justify-content:center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </div>
              <div>
                <strong style="display:block; font-size:0.9rem;">Añadir documento</strong>
                <span style="font-size:0.78rem;">Registra tus documentos</span>
              </div>
            </div>
          `;

          // Renderizar todos los documentos
          const docCards = data.map(doc => {
            const iconData = DOCS_ICON_MAP[doc.tipo] || DOCS_ICON_MAP['SOAT'];
            const status = getStatusBadge(doc.fechaVencimiento);
            return `
              <div class="doc-card" onclick="window.location='documents.html?motoId=${motoId}&docId=${doc.id}'">
                <div class="doc-card-icon" style="background: ${iconData.bg};">
                  ${iconData.icon}
                </div>
                <div class="doc-card-info">
                  <strong>${getDocTypeName(doc.tipo)}</strong>
                  <span>${doc.numeroPoliza || 'S/N'}</span>
                </div>
                <div class="doc-card-right">
                  ${status}
                  <span style="font-size:0.72rem; color:var(--text-muted);">${formatDate(doc.fechaVencimiento)}</span>
                </div>
              </div>
            `;
          }).join('');

          // Renderizar todo en un solo contenedor
          const docsContainer = document.getElementById('tab-documentos');
          docsContainer.innerHTML = addDocButton + docCards;
        })
        .catch(err => console.error('Error loading docs:', err));
    }

    // Cargar documentos cuando se cargue la página
    document.addEventListener('DOMContentLoaded', () => {
      loadGarageDocs();
    });
  </script>
</body>
</html>
