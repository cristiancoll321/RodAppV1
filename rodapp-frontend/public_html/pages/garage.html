<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RodApp — Garaje</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    .garage-moto-card {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, #0f1e27 0%, #0a141a 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative; overflow: hidden;
    }
    .garage-moto-card::after {
      content: '';
      position: absolute;
      bottom: -20px; right: -20px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(0,212,200,0.08), transparent 70%);
    }
    .moto-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .moto-info strong { font-family: var(--font-display); font-size: 1.3rem; display: block; }
    .moto-info span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }

    .doc-cards { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .doc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text-primary);
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .doc-card:hover { border-color: var(--border-glow); }
    .doc-card-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .doc-card-info { flex: 1; }
    .doc-card-info strong { display: block; font-size: 0.9rem; font-weight: 600; }
    .doc-card-info span { font-size: 0.78rem; color: var(--text-muted); }
    .doc-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    .add-doc-card {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; color: var(--text-muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .add-doc-card:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

    .empty-garage {
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 32px; text-align: center; gap: 12px;
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      margin: 0 16px 20px;
      background: var(--bg-surface);
      border-radius: var(--radius);
      padding: 4px;
    }
    .tab-btn {
      flex: 1; padding: 8px;
      background: transparent;
      border: none; border-radius: 8px;
      font-family: var(--font-display); font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--accent-cyan);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header fade-up stagger-1">
      <h2>Mi Garaje</h2>
      <a href="profile.html" style="display:flex; gap:8px; align-items:center; text-decoration:none; color:var(--text-secondary); font-size:0.85rem;">
        <div id="garage-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--accent-cyan);display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:700; color:var(--bg-dark); font-size:0.9rem;">...</div>
      </a>
    </div>

    <!-- Contenedor de motos -->
    <div id="motos-container" class="fade-up stagger-2"></div>

    <!-- Garaje vacío -->
    <div id="empty-garage" class="empty-garage fade-up stagger-2" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" width="48" height="48"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <p style="color:var(--text-muted); margin-top:8px;">Tu garaje está vacío</p>
      <p style="font-size:0.85rem; color:var(--text-muted);">Añade tu primera motocicleta</p>
    </div>

    <!-- Tabs Documentos -->
    <div id="garage-docs-container" style="display:none;">
      <div class="tabs fade-up stagger-2">
        <button class="tab-btn active" onclick="showTab('obligatorio', this)">Documentos</button>
      </div>

      <div id="tab-obligatorio" class="doc-cards fade-up stagger-3">
        <!-- Se cargará dinámicamente -->
      </div>

      <div style="padding: 16px;">
        <div class="add-doc-card" onclick="window.location='documents.html'">
          <div style="width:44px;height:44px;border-radius:10px;border:1px dashed;display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <div>
            <strong style="display:block; font-size:0.9rem;">Gestionar Documentos</strong>
            <span style="font-size:0.78rem;">Sube tu SOAT, RTM o Licencia</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Agregar moto -->
    <div style="padding: 20px 16px 0;">
      <a href="moto-register.html" class="btn btn-outline fade-up stagger-5">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Añadir motocicleta
      </a>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    async function initGarage() {
      const usuario = getUser();
      if (!usuario.id) return;
      
      // Avatar initials
      const avatar = document.getElementById('garage-avatar');
      if (avatar && usuario.name) {
        avatar.textContent = usuario.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0,2);
      }

      await loadGarageMotos();
      loadAllDocuments(usuario.id);
    }

    async function loadAllDocuments(usuarioId) {
      const container = document.getElementById('tab-obligatorio');
      const docsWrapper = document.getElementById('garage-docs-container');
      
      try {
        // Obtenemos todas las motos del usuario para traer sus documentos
        const resMotos = await fetch(`http://localhost:8081/api/motos/usuario/${usuarioId}`);
        const motos = await resMotos.json();

        if (motos.length === 0) {
          docsWrapper.style.display = 'none';
          return;
        }

        docsWrapper.style.display = 'block';
        let allDocsHtml = '';
        
        for (const moto of motos) {
          const resDocs = await fetch(`http://localhost:8081/api/documentos/moto/${moto.id}`);
          const docs = await resDocs.json();
          
          allDocsHtml += docs.map(d => `
            <a href="documents.html?id=${d.id}" class="doc-card">
              <div class="doc-card-icon" style="background:rgba(0,212,200,0.1);">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.8" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <div class="doc-card-info">
                <strong>${d.tipo}</strong>
                <span>Moto: ${moto.placa}</span>
              </div>
              <div class="doc-card-right">
                <span class="badge badge-cyan">${new Date(d.fechaVencimiento) > new Date() ? 'Vigente' : 'Vencido'}</span>
                <span style="font-size:0.72rem; color:var(--text-muted);">${new Date(d.fechaVencimiento).toLocaleDateString()}</span>
              </div>
            </a>
          `).join('');
        }

        if (!allDocsHtml) {
          container.innerHTML = '<p style="padding:20px; color:var(--text-muted); text-align:center; font-size:0.85rem;">No tienes documentos registrados aún.</p>';
        } else {
          container.innerHTML = allDocsHtml;
        }

      } catch (e) { console.error(e); }
    }

    document.addEventListener('DOMContentLoaded', initGarage);
    
    function showTab(tab, btn) {
      // Simplificado para esta versión
    }
  </script>
</body>
</html>
